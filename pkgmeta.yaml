package-as: AuctionDB

ignore:
    - install.bat
    - installprobe.bat
    - OldChangeLog.txt
    - luaformat.cfg
    - Probe
    - README.md
    - .github
    - AuctionDB/.luacheckrc

manual-changelog:
    filename: ChangeLog.txt
    markup-type: text

move-folders:
  AuctionDB/AuctionDB: AuctionDB

enable-nolib-creation: no
